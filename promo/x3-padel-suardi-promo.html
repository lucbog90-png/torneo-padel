<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>X3 Padel Suardi - Promo</title>
<style>
  :root{
    --w: 1080px;
    --h: 1920px;
  }
  html,body{
    margin:0; padding:0; background:#000; overflow:hidden;
    width:100%; height:100%;
  }
  #fit{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{
    position:relative;
    width:var(--w); height:var(--h);
    background:#000;
    overflow:hidden;
    transform-origin: center center;
    font-family: 'Arial Narrow', Arial, sans-serif;
  }
  .layer{
    position:absolute; inset:0;
    opacity:0;
    will-change: transform, opacity;
  }
  /* ---------- SPACE / EARTH ---------- */
  #layer-space{ background: radial-gradient(ellipse at 50% 30%, #050914 0%, #000005 60%, #000000 100%); }
  .stars{ position:absolute; inset:0; }
  .stars i{ position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; opacity:.8; }
  #camSpace{ position:absolute; inset:0; transform-origin: 50% 62%; }
  #earth{
    position:absolute; left:50%; top:64%; width:900px; height:900px;
    margin:-450px 0 0 -450px;
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, rgba(255,255,255,.35), rgba(255,255,255,0) 22%),
      radial-gradient(circle at 55% 60%, #1c6b3a 0 10%, transparent 11%),
      radial-gradient(circle at 30% 55%, #2c8a4a 0 14%, transparent 15%),
      radial-gradient(circle at 65% 40%, #237a41 0 9%, transparent 10%),
      radial-gradient(circle at 46% 75%, #1c6b3a 0 8%, transparent 9%),
      linear-gradient(135deg,#0a3d91,#0e5aa8 40%,#0a3d91 70%,#062a63);
    box-shadow: 0 0 90px 20px rgba(60,140,255,.35), inset -60px -40px 120px rgba(0,0,0,.55);
  }
  #argHighlight{
    position:absolute; left:50%; top:64%;
    width:900px; height:900px; margin:-450px 0 0 -450px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
  }
  #argHighlight svg{ width:120px; filter: drop-shadow(0 0 12px #fff176); }

  /* ---------- MAP (Argentina zoom) ---------- */
  #layer-map{ background:#04121f; }
  #mapWrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform-origin:50% 46%; }
  #mapWrap svg{ width:640px; }
  .label{
    position:absolute; left:50%; transform:translateX(-50%);
    color:#fff; text-transform:uppercase; letter-spacing:6px;
    text-shadow:0 2px 12px rgba(0,0,0,.8); opacity:0; font-weight:700;
  }
  #labelArgentina{ top:24%; font-size:46px; }
  #labelSuardi{ top:80%; font-size:34px; color:#ffe066; letter-spacing:6px; }
  #labelSuardiSub{ top:84.5%; font-size:18px; color:#cfe8ff; letter-spacing:4px; font-weight:400; }

  /* ---------- COURTS ---------- */
  #layer-courts{ background:#000; }
  .courtPhoto{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0; transform-origin:center;
  }
  #courtsVignette{ position:absolute; inset:0; background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 35%, rgba(0,0,0,.65) 100%); }
  #courtsCaption{
    position:absolute; bottom:9%; left:0; right:0; text-align:center;
    color:#fff; font-weight:700; letter-spacing:5px; font-size:34px;
    text-shadow:0 3px 14px rgba(0,0,0,.85); opacity:0; text-transform:uppercase;
  }

  /* ---------- BALL ---------- */
  #ball{
    position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px;
    left:50%; top:8%;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 30%, #f6ffb0, #d7e94a 40%, #a9c62b 75%, #7f9c1e 100%);
    box-shadow: 0 0 24px 6px rgba(220,255,120,.35), inset -10px -12px 20px rgba(0,0,0,.35);
    opacity:0; z-index:5;
  }
  #ball::before, #ball::after{
    content:''; position:absolute; inset:6px; border-radius:50%;
    border:2px dashed rgba(70,90,10,.45);
  }
  #ball::after{ inset:16px; border-style:solid; border-color:rgba(70,90,10,.25); }
  #ballTrail{
    position:absolute; width:70px; height:220px; margin:-30px 0 0 -35px;
    left:50%; top:8%; opacity:0; z-index:4;
    background:linear-gradient(to top, rgba(230,255,150,.35), rgba(230,255,150,0));
    filter: blur(2px);
  }

  /* ---------- BLACKOUT ---------- */
  #layer-black{ background:#000; }

  /* ---------- FINAL SCENE ---------- */
  #layer-final{ background:radial-gradient(ellipse at 50% 35%, #0b0b0f 0%, #000 70%); }
  .flag{
    position:absolute; top:10%; width:300px; height:420px;
    background:#000 url('assets/logo.png') center/cover no-repeat;
    border:6px solid #1a1a1a; box-shadow:0 20px 40px rgba(0,0,0,.6);
    opacity:0; transform-origin:top center;
  }
  #flagL{ left:4%; }
  #flagR{ right:4%; }
  @keyframes wave{
    0%{ transform: perspective(600px) rotateY(8deg) rotateX(2deg) skewY(1deg); }
    50%{ transform: perspective(600px) rotateY(-8deg) rotateX(-2deg) skewY(-1deg); }
    100%{ transform: perspective(600px) rotateY(8deg) rotateX(2deg) skewY(1deg); }
  }
  .flag.waving{ animation: wave 4.5s ease-in-out infinite; }

  #trophyL, #trophyR{ position:absolute; top:34%; width:190px; opacity:0; filter:drop-shadow(0 10px 20px rgba(0,0,0,.6)); }
  #trophyL{ left:16%; } #trophyR{ right:16%; }

  #finalBallWrap{ position:absolute; left:50%; top:22%; transform:translate(-50%,-50%); opacity:0; z-index:6; }
  #finalBallWrap .fb{
    width:150px; height:150px; border-radius:50%;
    background:
      radial-gradient(circle at 34% 30%, #f6ffb0, #d7e94a 40%, #a9c62b 75%, #7f9c1e 100%);
    box-shadow: 0 0 50px 14px rgba(220,255,120,.45), inset -16px -18px 30px rgba(0,0,0,.35);
    position:relative;
  }
  #finalBallWrap .fb::before, #finalBallWrap .fb::after{
    content:''; position:absolute; inset:10px; border-radius:50%; border:3px dashed rgba(70,90,10,.45);
  }
  #finalBallWrap .fb::after{ inset:26px; border-style:solid; border-color:rgba(70,90,10,.25); }

  #titleWrap{ position:absolute; left:0; right:0; top:46%; text-align:center; opacity:0; }
  #titleMain{
    font-size:96px; font-weight:900; color:#fff; letter-spacing:4px; margin:0;
    background:linear-gradient(180deg,#ffffff,#bcd7ff 60%,#6fa8ff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(90,150,255,.5);
  }
  #titleSub{ font-size:34px; color:#fff; letter-spacing:10px; margin-top:6px; font-weight:700; }

  #tourneyBadge{
    position:absolute; left:0; right:0; top:63%; text-align:center; opacity:0;
  }
  #tourneyBadge .pill{
    display:inline-block; padding:18px 46px; border-radius:60px;
    background:linear-gradient(135deg,#ffcc00,#ff9500);
    color:#111; font-weight:900; font-size:42px; letter-spacing:2px;
    box-shadow:0 10px 30px rgba(255,150,0,.4);
  }

  #jerseyWrap{ position:absolute; left:50%; top:78%; transform:translate(-50%,-50%); opacity:0; text-align:center; }
  #jerseyWrap .card{
    background:#fff; border-radius:22px; padding:14px 18px 6px;
    box-shadow:0 16px 34px rgba(0,0,0,.55);
  }
  #jerseyWrap img{ width:220px; display:block; }
  #jerseyWrap .cap{ margin-top:8px; color:#ffe066; font-weight:700; letter-spacing:2px; font-size:20px; text-shadow:0 2px 8px rgba(0,0,0,.7); }

  #cta{
    position:absolute; left:0; right:0; bottom:4%; text-align:center; opacity:0;
    color:#fff; font-size:30px; font-weight:700; letter-spacing:2px;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
  }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">

    <div class="layer" id="layer-space">
      <div class="stars" id="stars"></div>
      <div id="camSpace">
        <div id="earth"></div>
        <div id="argHighlight">
          <svg viewBox="0 0 100 160"><path d="M50 4 C66 10 74 26 70 44 C78 58 76 74 66 84 C72 96 66 112 56 118 C58 130 52 146 46 156 C42 148 40 134 38 120 C30 112 26 98 30 86 C22 76 22 60 30 48 C26 34 34 14 50 4 Z" fill="#fff176" stroke="#fff" stroke-width="1.5"/></svg>
        </div>
      </div>
    </div>

    <div class="layer" id="layer-map">
      <div id="mapWrap">
        <svg viewBox="0 0 100 160" preserveAspectRatio="xMidYMid meet">
          <path d="M50 4 C66 10 74 26 70 44 C78 58 76 74 66 84 C72 96 66 112 56 118 C58 130 52 146 46 156 C42 148 40 134 38 120 C30 112 26 98 30 86 C22 76 22 60 30 48 C26 34 34 14 50 4 Z"
                fill="#0d5c33" stroke="#bfe9c9" stroke-width="1"/>
        </svg>
      </div>
      <div class="label" id="labelArgentina">ARGENTINA</div>
      <div class="label" id="labelSuardi">SUARDI</div>
      <div class="label" id="labelSuardiSub">SANTA FE</div>
    </div>

    <div class="layer" id="layer-courts">
      <img class="courtPhoto" id="courtA" src="assets/court3.png">
      <img class="courtPhoto" id="courtB" src="assets/court1.png">
      <div id="courtsVignette"></div>
      <div id="courtsCaption">Canchas de X3 Padel Suardi</div>
    </div>

    <div id="ballTrail"></div>
    <div id="ball"></div>

    <div class="layer" id="layer-black"></div>

    <div class="layer" id="layer-final">
      <div class="flag" id="flagL"></div>
      <div class="flag" id="flagR"></div>
      <img id="trophyL" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23fff6cf'/><stop offset='.5' stop-color='%23ffd447'/><stop offset='1' stop-color='%23b5811a'/></linearGradient></defs><path d='M30 8h40v6c14 2 18 14 12 26-5 10-15 15-24 16 1 8 6 13 13 15v9H29v-9c7-2 12-7 13-15-9-1-19-6-24-16-6-12-2-24 12-26z' fill='url(%23g)' stroke='%238a5a0f' stroke-width='2'/><rect x='38' y='118' width='24' height='10' fill='url(%23g)' stroke='%238a5a0f' stroke-width='2'/><rect x='26' y='128' width='48' height='10' rx='2' fill='url(%23g)' stroke='%238a5a0f' stroke-width='2'/></svg>">
      <img id="trophyR" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160'><defs><linearGradient id='g2' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23fff6cf'/><stop offset='.5' stop-color='%23ffd447'/><stop offset='1' stop-color='%23b5811a'/></linearGradient></defs><path d='M30 8h40v6c14 2 18 14 12 26-5 10-15 15-24 16 1 8 6 13 13 15v9H29v-9c7-2 12-7 13-15-9-1-19-6-24-16-6-12-2-24 12-26z' fill='url(%23g2)' stroke='%238a5a0f' stroke-width='2'/><rect x='38' y='118' width='24' height='10' fill='url(%23g2)' stroke='%238a5a0f' stroke-width='2'/><rect x='26' y='128' width='48' height='10' rx='2' fill='url(%23g2)' stroke='%238a5a0f' stroke-width='2'/></svg>">
      <div id="finalBallWrap"><div class="fb"></div></div>
      <div id="titleWrap">
        <p id="titleMain">X3 PADEL SUARDI</p>
        <p id="titleSub">TORNEO&nbsp;&nbsp;OFICIAL</p>
      </div>
      <div id="tourneyBadge"><span class="pill">SUMA 13 &middot; LIBRES</span></div>
      <div id="jerseyWrap"><div class="card"><img src="assets/jersey.png"></div><div class="cap">Camiseta oficial del torneo</div></div>
      <div id="cta">&iexcl;Te esperamos! Inscribite y sum&aacute; tus puntos</div>
    </div>

  </div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  function fitStage(){
    const sw = window.innerWidth, sh = window.innerHeight;
    const scale = Math.min(sw/1080, sh/1920);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage); fitStage();

  // starfield
  const starsEl = document.getElementById('stars');
  let starsHTML = '';
  for(let i=0;i<140;i++){
    const x = Math.random()*100, y = Math.random()*100;
    const s = Math.random()*2+1, o = Math.random()*0.8+0.2;
    starsHTML += '<i style="left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;opacity:'+o+'"></i>';
  }
  starsEl.innerHTML = starsHTML;

  const el = {
    space: document.getElementById('layer-space'),
    camSpace: document.getElementById('camSpace'),
    earth: document.getElementById('earth'),
    argHi: document.getElementById('argHighlight'),
    map: document.getElementById('layer-map'),
    mapWrap: document.getElementById('mapWrap'),
    labelArg: document.getElementById('labelArgentina'),
    labelSuardi: document.getElementById('labelSuardi'),
    labelSuardiSub: document.getElementById('labelSuardiSub'),
    courts: document.getElementById('layer-courts'),
    courtA: document.getElementById('courtA'),
    courtB: document.getElementById('courtB'),
    courtsCaption: document.getElementById('courtsCaption'),
    ball: document.getElementById('ball'),
    ballTrail: document.getElementById('ballTrail'),
    black: document.getElementById('layer-black'),
    final: document.getElementById('layer-final'),
    flagL: document.getElementById('flagL'),
    flagR: document.getElementById('flagR'),
    trophyL: document.getElementById('trophyL'),
    trophyR: document.getElementById('trophyR'),
    finalBall: document.getElementById('finalBallWrap'),
    titleWrap: document.getElementById('titleWrap'),
    badge: document.getElementById('tourneyBadge'),
    jersey: document.getElementById('jerseyWrap'),
    cta: document.getElementById('cta'),
  };

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function seg(t,t0,t1){ if(t1<=t0) return t>=t1?1:0; return clamp((t-t0)/(t1-t0),0,1); }
  function ease(p){ return p*p*(3-2*p); }
  function lerp(a,b,p){ return a+(b-a)*p; }
  function easeSeg(t,t0,t1){ return ease(seg(t,t0,t1)); }

  // Ball trajectory keypoints for t in [0, 16.3]
  const KP = [
    {t:0.0,  x:50, y:6,  s:0.42},
    {t:2.5,  x:51, y:16, s:0.6},
    {t:5.0,  x:49, y:30, s:0.85},
    {t:7.5,  x:48, y:42, s:1.05},
    {t:9.5,  x:49, y:52, s:1.3},
    {t:12.0, x:50, y:60, s:1.7},
    {t:14.3, x:50, y:66, s:2.15},
    {t:15.6, x:50, y:66, s:2.2},
    {t:16.3, x:50, y:66, s:2.2},
  ];
  function ballAt(t){
    if(t<=KP[0].t) return KP[0];
    for(let i=0;i<KP.length-1;i++){
      const a=KP[i], b=KP[i+1];
      if(t>=a.t && t<=b.t){
        const p = ease(seg(t,a.t,b.t));
        return { x:lerp(a.x,b.x,p), y:lerp(a.y,b.y,p), s:lerp(a.s,b.s,p) };
      }
    }
    return KP[KP.length-1];
  }

  function render(t){
    // ===== SPACE (0 - 9.5) =====
    const spaceIn  = easeSeg(t,0,0.6);
    const spaceOut = 1-easeSeg(t,8.3,9.6);
    el.space.style.opacity = Math.min(spaceIn, spaceOut);
    const camScale = lerp(1, 2.35, easeSeg(t,0,9.4));
    el.camSpace.style.transform = 'scale('+camScale+')';
    const earthRot = lerp(-6, 10, easeSeg(t,0,9.4));
    el.earth.style.transform = 'rotate('+earthRot+'deg)';
    const argHiOpacity = easeSeg(t,6.5,8.2) * (1-easeSeg(t,8.6,9.5));
    el.argHi.style.opacity = argHiOpacity;
    el.argHi.style.transform = 'rotate(' + (earthRot*-1) + 'deg)';

    // ===== MAP (8.6 - 12.6) =====
    const mapIn  = easeSeg(t,8.6,9.8);
    const mapOut = 1-easeSeg(t,12.0,12.9);
    el.map.style.opacity = Math.min(mapIn, mapOut);
    const mapScale = lerp(0.9, 2.6, easeSeg(t,8.6,12.6));
    el.mapWrap.style.transform = 'scale('+mapScale+')';
    el.labelArg.style.opacity = easeSeg(t,8.9,9.5) * (1-easeSeg(t,11.4,12.0));
    el.labelSuardi.style.opacity = easeSeg(t,10.6,11.2) * (1-easeSeg(t,12.2,12.8));
    el.labelSuardiSub.style.opacity = el.labelSuardi.style.opacity;

    // ===== COURTS (12.2 - 16.3) =====
    const courtsIn = easeSeg(t,12.2,13.2);
    const courtsOut = 1-easeSeg(t,15.9,16.35);
    el.courts.style.opacity = Math.min(courtsIn, courtsOut);
    el.courtA.style.opacity = 1 - easeSeg(t,13.9,14.6);
    el.courtB.style.opacity = easeSeg(t,13.9,14.6);
    const courtsZoom = lerp(1.25, 1.0, easeSeg(t,12.2,16.3));
    el.courtA.style.transform = 'scale('+courtsZoom+')';
    el.courtB.style.transform = 'scale('+courtsZoom+')';
    el.courtsCaption.style.opacity = easeSeg(t,14.0,14.8) * (1-easeSeg(t,15.9,16.3));

    // ===== BALL (falls through all of the above, 0 - 16.3) =====
    if(t <= 16.35){
      const b = ballAt(Math.min(t,16.3));
      const ballOpacity = easeSeg(t,0.15,0.6) * (1-easeSeg(t,16.0,16.35));
      el.ball.style.opacity = ballOpacity;
      el.ball.style.left = b.x+'%';
      el.ball.style.top = b.y+'%';
      el.ball.style.transform = 'scale('+b.s+') rotate('+(t*140)+'deg)';
      el.ballTrail.style.opacity = ballOpacity*0.7;
      el.ballTrail.style.left = b.x+'%';
      el.ballTrail.style.top = (b.y-6)+'%';
      el.ballTrail.style.transform = 'scale('+ (b.s*0.9) +')';
    } else {
      el.ball.style.opacity = 0;
      el.ballTrail.style.opacity = 0;
    }

    // ===== BLACKOUT (16.0 - end) =====
    el.black.style.opacity = easeSeg(t,16.0,17.0);

    // ===== FINAL SCENE (17.2 - 25) =====
    const finalIn = easeSeg(t,17.2,18.4);
    el.final.style.opacity = finalIn;

    el.flagL.style.opacity = easeSeg(t,17.6,18.6);
    el.flagR.style.opacity = easeSeg(t,17.9,18.9);
    if(t>18.6) el.flagL.classList.add('waving');
    if(t>18.9) el.flagR.classList.add('waving');
    el.flagL.style.transform = el.flagL.classList.contains('waving') ? '' : 'translateY(' + lerp(40,0,easeSeg(t,17.6,18.6)) + 'px)';
    el.flagR.style.transform = el.flagR.classList.contains('waving') ? '' : 'translateY(' + lerp(40,0,easeSeg(t,17.9,18.9)) + 'px)';

    const trophyPop = easeSeg(t,18.2,19.2);
    el.trophyL.style.opacity = trophyPop;
    el.trophyR.style.opacity = trophyPop;
    el.trophyL.style.transform = 'translateY(' + lerp(60,0,trophyPop) + 'px)';
    el.trophyR.style.transform = 'translateY(' + lerp(60,0,trophyPop) + 'px)';

    const fbPop = easeSeg(t,17.4,18.3);
    el.finalBall.style.opacity = fbPop;
    const bob = Math.sin(t*2.2)*10;
    el.finalBall.style.transform = 'translate(-50%,-50%) translateY(' + (lerp(-40,0,fbPop)+bob) + 'px) rotate(' + (t*60) + 'deg)';

    el.titleWrap.style.opacity = easeSeg(t,19.2,20.2);
    el.titleWrap.style.transform = 'translateY(' + lerp(20,0,easeSeg(t,19.2,20.2)) + 'px)';

    el.badge.style.opacity = easeSeg(t,20.4,21.2);
    const pulse = 1 + Math.sin(t*4)*0.03;
    el.badge.style.transform = 'scale(' + pulse + ')';

    el.jersey.style.opacity = easeSeg(t,21.4,22.3);
    el.jersey.style.transform = 'translate(-50%,-50%) translateY(' + lerp(20,0,easeSeg(t,21.4,22.3)) + 'px)';

    el.cta.style.opacity = easeSeg(t,22.6,23.6);
  }

  window.__seek = render;
  render(0);

  // live autoplay (when opened directly in a browser)
  if(!window.__CAPTURE_MODE__){
    let start = null;
    const DURATION = 25;
    function frame(ts){
      if(start===null) start = ts;
      const t = (ts-start)/1000;
      render(Math.min(t, DURATION));
      if(t < DURATION) requestAnimationFrame(frame);
      else setTimeout(()=>{ start=null; requestAnimationFrame(frame); }, 1500);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
